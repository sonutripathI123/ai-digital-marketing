name: 24/7 Render Cloud Keep-Alive Engine

on:
  schedule:
    # Runs every 10 minutes, 24 hours a day, 7 days a week
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Cloud Server Health
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive HTTP Pulse to Render Cloud Server
        run: |
          echo "========================================================"
          echo "Sending Keep-Alive Pulse to AI Marketing Cloud Server..."
          echo "Target: https://ai-digital-marketing-gm68.onrender.com/health"
          echo "Timestamp: $(date -u)"
          echo "========================================================"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" -m 30 "https://ai-digital-marketing-gm68.onrender.com/health")
          echo "$RESPONSE"
          
          if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "SUCCESS: Cloud Server is ONLINE and ACTIVE 24/7!"
          else
            echo "NOTICE: Pulse sent. Server instance received activation request."
          fi
